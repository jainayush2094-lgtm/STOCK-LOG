<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Stock Log — Codex</title>

<!-- ===== PWA WIRING (makes it installable from GitHub Pages) ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0e0f">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ---------------- THEME TOKENS ---------------- */
:root{
  --gold:#c5a23e; --emerald:#3ea577; --rose:#d06a6a; --sky:#5b94c9;
  --radius:18px;
}
/* DARK (default) */
html[data-theme="dark"]{
  --bg:#0e0e0f;
  --orb1:rgba(197,162,62,.20); --orb2:rgba(62,165,119,.18);
  --ink:#f4f1ea; --muted:#8c8a86; --faint:#5f5d59;
  --card:rgba(255,255,255,.06); --card-border:rgba(255,255,255,.10);
  --field:rgba(0,0,0,.28); --field-border:rgba(255,255,255,.10);
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --chip:rgba(255,255,255,.06);
}
/* LIGHT — crystal white, neutral (no cream/grey cast) */
html[data-theme="light"]{
  --bg:#ffffff;
  --orb1:rgba(197,162,62,.14); --orb2:rgba(62,165,119,.12);
  --ink:#161719; --muted:#6a6e75; --faint:#a7abb2;
  --card:rgba(255,255,255,.72); --card-border:rgba(20,22,28,.08);
  --field:rgba(20,22,28,.035); --field-border:rgba(20,22,28,.10);
  --shadow:0 8px 30px rgba(20,30,60,.08);
  --chip:rgba(20,22,28,.05);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Manrope',sans-serif; background:var(--bg); color:var(--ink);
  min-height:100vh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overflow-x:hidden; position:relative; transition:background .4s,color .4s;
}
/* ambient orbs for liquid-glass depth */
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;transition:background .4s}
body::before{width:360px;height:360px;background:var(--orb1);top:-130px;right:-110px}
body::after{width:320px;height:320px;background:var(--orb2);bottom:-130px;left:-120px}

.wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:26px 18px 90px}

/* ---------------- HEADER ---------------- */
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:12px}
.brand .kicker{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:32px;line-height:1;letter-spacing:-.02em}
.hbtns{display:flex;gap:8px;flex-shrink:0}
.iconbtn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--card-border);background:var(--card);
  color:var(--ink);font-size:17px;cursor:pointer;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;
  transition:transform .12s,border-color .12s;
}
.iconbtn:active{transform:scale(.9)}

/* ---------------- FILTER CHIPS ---------------- */
.filters{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:1 1 auto;font-family:'Manrope';font-size:11px;font-weight:600;letter-spacing:0;
  padding:6px 7px;border-radius:999px;border:1px solid var(--card-border);background:var(--chip);
  color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s;text-align:center;
}
.chip .n{font-family:'JetBrains Mono',monospace;font-weight:700;margin-left:3px;opacity:.7;font-size:10px}
.chip.active{color:var(--ink);border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}

/* ---------------- ADD BUTTON ---------------- */
.addbtn{
  width:100%;background:var(--gold);color:#1a1408;border:none;border-radius:14px;
  padding:15px;font-family:'Manrope';font-weight:700;font-size:15px;letter-spacing:.01em;cursor:pointer;
  margin-bottom:18px;transition:transform .12s,filter .12s;box-shadow:var(--shadow);
}
.addbtn:active{transform:scale(.985);filter:brightness(1.06)}

/* ---------------- SEARCH + SORT ---------------- */
.tools{display:flex;gap:8px;margin-bottom:16px}
.search{flex:1;position:relative;display:flex;align-items:center}
.search .si{position:absolute;left:12px;color:var(--muted);font-size:16px;pointer-events:none;line-height:1}
.search input{
  width:100%;background:var(--field);border:1px solid var(--field-border);border-radius:12px;
  color:var(--ink);padding:11px 12px 11px 34px;font-size:14px;font-family:'Manrope';transition:border-color .15s;
}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--gold)}
.sortbtn{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--chip);
  border:1px solid var(--card-border);border-radius:12px;color:var(--muted);
  font-family:'Manrope';font-weight:600;font-size:12px;padding:0 13px;cursor:pointer;white-space:nowrap;transition:all .15s;
}
.sortbtn .sb-ic{font-size:14px}
.sortbtn.active{color:var(--ink);border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}

/* priority select accents */
.field select.pri-top{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.field select.pri-medium{color:var(--sky);border-color:color-mix(in srgb,var(--sky) 45%,transparent)}

/* ---------------- STOCK CARD ---------------- */
.card{
  position:relative;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:16px 16px 14px;
  margin-bottom:14px;box-shadow:var(--shadow);
  border-left:3px solid var(--faint); transition:border-color .2s,opacity .2s,transform .2s;
  content-visibility:auto;contain-intrinsic-size:auto 240px;
}
.card.s-cand{border-left-color:var(--gold)}
.card.s-near{border-left-color:var(--sky)}
.card.s-in{border-left-color:var(--emerald)}
.card.s-no{border-left-color:var(--rose)}

.card .toprow{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.tk-input{
  flex:1;background:transparent;border:none;color:var(--ink);font-family:'Fraunces',serif;font-weight:600;
  font-size:21px;letter-spacing:-.01em;padding:2px 0;min-width:0;
}
.tk-input::placeholder{color:var(--faint);font-style:italic}
.tk-input:focus{outline:none}

.status-sel{
  flex:0 0 auto;max-width:118px;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;border-radius:999px;padding:7px 11px;border:1px solid var(--card-border);
  background:var(--field);color:var(--muted);cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center;
}
.card.s-cand .status-sel{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.card.s-near .status-sel{color:var(--sky);border-color:color-mix(in srgb,var(--sky) 50%,transparent)}
.card.s-in   .status-sel{color:var(--emerald);border-color:color-mix(in srgb,var(--emerald) 50%,transparent)}
.card.s-no   .status-sel{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 50%,transparent)}

/* field grid */
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:11px}
.field{display:flex;flex-direction:column;gap:4px}
.field.span3{grid-column:1 / -1}
.field label{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field .sub{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500}
.field input,.field select{
  width:100%;background:var(--field);border:1px solid var(--field-border);border-radius:10px;
  color:var(--ink);padding:9px 10px;font-size:14px;font-family:'Manrope';transition:border-color .15s;
}
.field input.num{font-family:'JetBrains Mono',monospace;font-weight:500}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold)}
.field select{appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 17px,calc(100% - 10px) 17px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:26px}

/* R:R readout */
.rr-box{display:flex;flex-direction:column;gap:4px}
.rr-box label{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rr-val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;padding:9px 10px;border-radius:10px;
  background:var(--field);border:1px solid var(--field-border);text-align:center;color:var(--faint)}
.rr-val.good{color:var(--emerald);border-color:color-mix(in srgb,var(--emerald) 40%,transparent)}
.rr-val.ok{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.rr-val.bad{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 40%,transparent)}

.note-input{
  width:100%;background:var(--field);border:1px solid var(--field-border);border-radius:11px;color:var(--ink);
  padding:10px 12px;font-size:13.5px;font-family:'Manrope';line-height:1.5;resize:vertical;min-height:42px;
}
.note-input::placeholder{color:var(--faint)}
.note-input:focus{outline:none;border-color:var(--gold)}

.card .foot{display:flex;justify-content:flex-end;margin-top:9px}
.del{background:none;border:none;color:var(--faint);font-family:'JetBrains Mono',monospace;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:4px 2px;transition:color .15s}
.del:active{color:var(--rose)}

.empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 10px;font-style:italic}

footer{text-align:center;color:var(--faint);font-size:10px;margin-top:22px;font-family:'JetBrains Mono',monospace;letter-spacing:.12em}
footer a{color:var(--muted);text-decoration:none;cursor:pointer;border-bottom:1px dotted var(--faint)}
.tps{display:none}
.hid{display:none}

/* ---------------- v3: ENTRY GATE MODAL ---------------- */
.gate-ov{position:fixed;inset:0;background:rgba(8,8,10,.6);backdrop-filter:blur(4px);z-index:100;
  display:none;align-items:flex-end;justify-content:center}
.gate-ov.show{display:flex}
.gate{width:100%;max-width:600px;background:var(--bg);border:1px solid var(--card-border);
  border-radius:24px 24px 0 0;padding:24px 20px calc(28px + env(safe-area-inset-bottom))}
.gate .g-kicker{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.gate .g-title{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin-bottom:4px}
.gate .g-sub{font-size:12.5px;color:var(--muted);margin-bottom:18px;line-height:1.5}
.gitem{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:14px;margin-bottom:10px;
  background:var(--card);border:1px solid var(--card-border)}
.gitem .g-ic{flex:0 0 24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;margin-top:1px}
.gitem.pass .g-ic{background:color-mix(in srgb,var(--emerald) 18%,transparent);color:var(--emerald)}
.gitem.fail .g-ic{background:color-mix(in srgb,var(--rose) 18%,transparent);color:var(--rose)}
.gitem .g-txt{flex:1}
.gitem .g-name{font-weight:700;font-size:13.5px}
.gitem .g-det{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px}
.gitem.fail .g-det{color:var(--rose)}
.gitem.manual{cursor:pointer;transition:border-color .15s}
.gitem.manual .g-ic{background:var(--field);color:var(--faint);border:1px solid var(--field-border)}
.gitem.manual.checked{border-color:color-mix(in srgb,var(--emerald) 45%,transparent)}
.gitem.manual.checked .g-ic{background:color-mix(in srgb,var(--emerald) 18%,transparent);color:var(--emerald);border-color:transparent}
.gate-btns{display:flex;gap:10px;margin-top:16px}
.gbtn{flex:1;border:none;border-radius:13px;padding:15px;font-family:'Manrope';font-weight:700;font-size:14px;cursor:pointer}
.gbtn.ghost{background:var(--field);color:var(--muted);border:1px solid var(--field-border)}
.gbtn.solid{background:var(--gold);color:#1a1408}
.gbtn.solid:disabled{opacity:.35;cursor:not-allowed}
.gate-hint{text-align:center;font-size:10.5px;color:var(--faint);margin-top:12px;font-family:'JetBrains Mono',monospace;letter-spacing:.04em}

/* ---------------- v3: BACKUP BANNER ---------------- */
.bkbanner{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:12px 14px;border-radius:14px;
  background:color-mix(in srgb,var(--rose) 10%,transparent);border:1px solid color-mix(in srgb,var(--rose) 28%,transparent)}
.bkbanner span{flex:1;font-size:12px;font-weight:600;color:var(--ink);line-height:1.45}
.bkbanner button{border:none;border-radius:9px;padding:8px 12px;font-family:'Manrope';font-weight:700;font-size:11.5px;cursor:pointer}
.bkbanner .bk-now{background:var(--gold);color:#1a1408}
.bkbanner .bk-later{background:transparent;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="kicker">Swing Trader's Codex</div>
      <h1>Stock Log</h1>
    </div>
    <div class="hbtns">
      <button class="iconbtn" id="themeBtn" title="Toggle theme" onclick="toggleTheme()">☾</button>
    </div>
  </header>

  <div id="bkBanner" class="bkbanner hid"></div>

  <div class="filters" id="filters">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">All <span class="n" id="c-all">0</span></button>
    <button class="chip" data-f="cand" onclick="setFilter('cand',this)">Candidate <span class="n" id="c-cand">0</span></button>
    <button class="chip" data-f="near" onclick="setFilter('near',this)">Near <span class="n" id="c-near">0</span></button>
    <button class="chip" data-f="in"   onclick="setFilter('in',this)">Entered <span class="n" id="c-in">0</span></button>
    <button class="chip" data-f="no"   onclick="setFilter('no',this)">Avoid <span class="n" id="c-no">0</span></button>
  </div>

  <div class="tools">
    <div class="search">
      <span class="si">⌕</span>
      <input id="searchBox" type="text" placeholder="Search by name…" inputmode="search" autocomplete="off" oninput="setSearch(this.value)">
    </div>
    <button class="sortbtn" id="sortBtn" onclick="toggleSort()" title="Sort by priority">
      <span class="sb-ic">⇅</span><span class="sb-lbl">Recent</span>
    </button>
  </div>

  <button class="addbtn" onclick="addStock()">＋  Add a stock</button>

  <div id="list"></div>

  <footer>
    STORED ON THIS DEVICE · v5 &nbsp;·&nbsp;
    <a onclick="exportData()">Backup</a> &nbsp;·&nbsp;
    <a onclick="document.getElementById('imp').click()">Restore</a>
    <input id="imp" class="tps" type="file" accept="application/json" onchange="importData(event)">
  </footer>
</div>

<!-- ===== v3: PRE-ENTRY GATE ===== -->
<div class="gate-ov" id="gateOv">
  <div class="gate">
    <div class="g-kicker">Pre-Entry Gate</div>
    <div class="g-title" id="gateTitle">Confirm entry</div>
    <div class="g-sub">A trade is a defined entry, a defined stop, and at least 2:1. Pass every gate or it stays a watchlist name.</div>
    <div id="gateChecks"></div>
    <div class="gate-btns">
      <button class="gbtn ghost" onclick="gateCancel()">Not yet</button>
      <button class="gbtn solid" id="gateConfirm" onclick="gateConfirmEntry()" disabled>Mark entered</button>
    </div>
    <div class="gate-hint">GATES IN ORDER · STOP AT FIRST FAILURE</div>
  </div>
</div>

<script>
/* ---------------- CONSTANTS ---------------- */
const SETUPS = ["9 EMA Pullback","21 EMA Pullback","Base Breakout","VCP","Stage 2 Breakout",
  "Shakeout & Reclaim","Flat Base","Cup & Handle","High Tight Flag","Double Bottom","Ascending Base"];
const STATUS = [
  {v:"cand", label:"Candidate"},
  {v:"near", label:"Near"},
  {v:"in",   label:"Entered"},
  {v:"no",   label:"Avoid"}
];
const PRIORITY = [
  {v:"none",   label:"None"},
  {v:"top",    label:"Top priority"},
  {v:"medium", label:"Medium priority"}
];
const KEY = 'codex_stock_log_v1';
const TKEY = 'codex_stock_log_theme';
const SKEY = 'codex_stock_log_sort';

/* ---------------- STATE ---------------- */
let stocks = [];
try{ stocks = JSON.parse(localStorage.getItem(KEY) || '[]'); }catch(e){ stocks = []; }
let filter = 'all';
let searchTerm = '';
let sortMode = 'recent';
try{ sortMode = localStorage.getItem(SKEY) || 'recent'; }catch(e){}

/* immediate write — used for structural changes (add, delete, status, priority, import) */
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(stocks)); }catch(e){} }
/* debounced write — used while typing so we don't stringify+write on every keystroke */
let _saveT=null;
function saveSoon(){ clearTimeout(_saveT); _saveT=setTimeout(()=>{ _saveT=null; save(); }, 400); }
function flushSave(){ if(_saveT){ clearTimeout(_saveT); _saveT=null; } save(); }
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushSave(); });

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ---------------- THEME ---------------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = (t==='dark') ? '☾' : '☀';
  document.querySelector('meta[name=theme-color]').setAttribute('content', t==='dark' ? '#0e0e0f' : '#ffffff');
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : 'dark';
  applyTheme(next); try{ localStorage.setItem(TKEY,next); }catch(e){}
}
applyTheme(localStorage.getItem(TKEY) || 'dark');

/* ---------------- R:R ---------------- */
function rr(price,target,stop){
  const p=parseFloat(price),t=parseFloat(target),s=parseFloat(stop);
  if(isNaN(p)||isNaN(t)||isNaN(s)||p<=0) return {txt:'—',cls:''};
  const reward=t-p, risk=p-s;
  if(risk<=0||reward<=0) return {txt:'—',cls:'bad'};
  const r=reward/risk;
  const cls = r>=2 ? 'good' : (r>=1 ? 'ok':'bad');
  return {txt:r.toFixed(1)+' : 1', cls};
}
function pct(price,other){
  const p=parseFloat(price),o=parseFloat(other);
  if(isNaN(p)||isNaN(o)||p<=0) return '';
  const v=(o-p)/p*100;
  return (v>=0?'+':'')+v.toFixed(1)+'%';
}

/* ---------------- CARD ---------------- */
function buildCard(st){
  const card=document.createElement('div');
  card.className='card s-'+st.status;
  card.dataset.id=st.id; card.dataset.status=st.status;

  const legacy = (st.setup && !SETUPS.includes(st.setup)) ? `<option selected>${esc(st.setup)}</option>` : '';
  const setupOpts = ['<option value="">Setup…</option>'+legacy]
    .concat(SETUPS.map(s=>`<option ${st.setup===s?'selected':''}>${s}</option>`)).join('');
  const statusOpts = STATUS.map(o=>`<option value="${o.v}" ${st.status===o.v?'selected':''}>${o.label}</option>`).join('');
  const pv = st.priority || 'none';
  const priOpts = PRIORITY.map(o=>`<option value="${o.v}" ${pv===o.v?'selected':''}>${o.label}</option>`).join('');

  card.innerHTML = `
    <div class="toprow">
      <input class="tk-input" placeholder="Stock name" value="${esc(st.name)}" data-k="name">
      <select class="status-sel" data-k="status">${statusOpts}</select>
    </div>
    <div class="grid">
      <div class="field"><label>Current ₹</label><input class="num" inputmode="decimal" placeholder="0" value="${esc(st.price)}" data-k="price"></div>
      <div class="field"><label>Target ₹</label><input class="num" inputmode="decimal" placeholder="0" value="${esc(st.target)}" data-k="target"><span class="sub good t-sub"></span></div>
      <div class="field"><label>Stop ₹</label><input class="num" inputmode="decimal" placeholder="0" value="${esc(st.stop)}" data-k="stop"><span class="sub bad s-sub" style="color:var(--rose)"></span></div>
      <div class="field span3" style="grid-template-columns:none;display:grid;grid-template-columns:1.6fr 1fr;gap:9px">
        <div class="field"><label>Setup</label><select data-k="setup">${setupOpts}</select></div>
        <div class="rr-box"><label>Risk : Reward</label><div class="rr-val rr-out">—</div></div>
      </div>
      <div class="field span3" style="grid-template-columns:none;display:grid;grid-template-columns:1fr 1fr;gap:9px">
        <div class="field"><label>Priority</label><select class="pri-sel pri-${pv}" data-k="priority">${priOpts}</select></div>
        <div class="field"><label>Entry date</label><input type="date" class="num" value="${esc(st.date)}" data-k="date"></div>
      </div>
    </div>
    <textarea class="note-input" placeholder="Notes — pivot, trigger, sector, anything…" data-k="note">${esc(st.note)}</textarea>
    <div class="foot"><button class="del">Delete</button></div>
  `;

  // wire inputs/selects
  card.querySelectorAll('[data-k]').forEach(el=>{
    const k=el.dataset.k;
    const ev = (el.tagName==='SELECT'||el.type==='date') ? 'change' : 'input';
    el.addEventListener(ev, ()=>{
      // v3: entering a position must pass the gate first
      if(k==='status' && el.value==='in' && st.status!=='in'){
        openGate(card, st, el);
        return;
      }
      st[k]=el.value;
      if(k==='status'){
        save(); updateStatusClass(card,st.status); recount(); applyFilterTo(card); checkFilterEmpty();
      } else if(k==='priority'){
        save(); el.className='pri-sel pri-'+el.value;
        if(sortMode==='priority') reorderDOM();
      } else if(k==='name'){
        saveSoon(); if(searchTerm) applyFilterTo(card);
      } else if(k==='price'||k==='target'||k==='stop'){
        refreshRR(card,st); saveSoon();
      } else {
        saveSoon(); // note, date
      }
    });
  });
  card.querySelector('.del').addEventListener('click', ()=>{
    if(!confirm('Delete '+(st.name||'this stock')+'?')) return;
    stocks=stocks.filter(x=>x.id!==st.id); save();
    card.style.opacity='0'; card.style.transform='scale(.97)';
    setTimeout(()=>{ card.remove(); recount(); checkEmpty(); checkFilterEmpty(); },180);
  });

  refreshRR(card,st);
  return card;
}

function refreshRR(card,st){
  const out=card.querySelector('.rr-out');
  const r=rr(st.price,st.target,st.stop);
  out.textContent=r.txt; out.className='rr-val rr-out '+r.cls;
  card.querySelector('.t-sub').textContent=pct(st.price,st.target);
  card.querySelector('.s-sub').textContent=pct(st.price,st.stop);
}
function updateStatusClass(card,status){
  card.className='card s-'+status; card.dataset.status=status;
}

/* ---------------- RENDER / FILTER ---------------- */
const listEl=document.getElementById('list');

/* priority ranking for sort */
const PRI_RANK={top:0,medium:1,none:2,'':2,undefined:2};
function orderedStocks(){
  if(sortMode!=='priority') return stocks;
  return stocks
    .map((s,i)=>({s,i}))
    .sort((a,b)=>(PRI_RANK[a.s.priority]-PRI_RANK[b.s.priority]) || (a.i-b.i))
    .map(o=>o.s);
}
/* reorder existing card nodes (no rebuild — keeps inputs/focus intact) */
function reorderDOM(){
  orderedStocks().forEach(s=>{
    const c=listEl.querySelector('.card[data-id="'+s.id+'"]');
    if(c) listEl.appendChild(c);
  });
  const fe=document.getElementById('fempty'); if(fe) listEl.appendChild(fe);
}
function renderAll(){
  listEl.innerHTML='';
  orderedStocks().forEach(st=>listEl.appendChild(buildCard(st)));
  recount(); checkEmpty(); applyFilterAll();
}
function checkEmpty(){
  if(!stocks.length && !listEl.querySelector('.card')){
    listEl.innerHTML='<div class="empty">No stocks logged yet.<br>Tap “Add a stock” to begin.</div>';
  }else{
    const e=listEl.querySelector('.empty'); if(e && listEl.querySelector('.card')) e.remove();
  }
}
function recount(){
  const cnt={all:0,cand:0,near:0,in:0,no:0};
  listEl.querySelectorAll('.card').forEach(c=>{cnt.all++; cnt[c.dataset.status]++;});
  for(const k in cnt){ const el=document.getElementById('c-'+k); if(el) el.textContent=cnt[k]; }
}
function setFilter(f,btn){
  filter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  applyFilterAll();
}
function applyFilterAll(){ listEl.querySelectorAll('.card').forEach(applyFilterTo); checkFilterEmpty(); }
function applyFilterTo(card){
  const statusOk = (filter==='all'||card.dataset.status===filter);
  const nameEl=card.querySelector('.tk-input');
  const nameVal=(nameEl?nameEl.value:'').toLowerCase();
  const searchOk = !searchTerm || nameVal.includes(searchTerm);
  card.style.display = (statusOk && searchOk) ? '' : 'none';
}
/* search */
function setSearch(v){ searchTerm=(v||'').trim().toLowerCase(); applyFilterAll(); }
/* sort toggle: Recent <-> Priority (sticky) */
function toggleSort(){
  sortMode = (sortMode==='priority') ? 'recent' : 'priority';
  try{ localStorage.setItem(SKEY, sortMode); }catch(e){}
  syncSortBtn();
  reorderDOM();
}
function syncSortBtn(){
  const b=document.getElementById('sortBtn'); if(!b) return;
  const on = sortMode==='priority';
  b.classList.toggle('active', on);
  b.querySelector('.sb-lbl').textContent = on ? 'Priority' : 'Recent';
}
/* v3 fix: show a message when the active filter hides every card */
function checkFilterEmpty(){
  let fe=document.getElementById('fempty');
  const anyVisible=[...listEl.querySelectorAll('.card')].some(c=>c.style.display!=='none');
  if(stocks.length && !anyVisible){
    if(!fe){ fe=document.createElement('div'); fe.id='fempty'; fe.className='empty';
      fe.textContent='Nothing in this bucket.'; listEl.appendChild(fe); }
  } else if(fe) fe.remove();
}

/* ---------------- v3: PRE-ENTRY GATE ---------------- */
let gateCtx=null; // {card, st, sel, manual:{earnings:false, weekly:false}}
function openGate(card, st, sel){
  gateCtx={card, st, sel, manual:{earnings:false, weekly:false}};
  document.getElementById('gateTitle').textContent=(st.name||'This stock')+' — confirm entry';
  renderGate();
  document.getElementById('gateOv').classList.add('show');
}
function renderGate(){
  const {st, manual}=gateCtx;
  const p=parseFloat(st.price), t=parseFloat(st.target), s=parseFloat(st.stop);
  const r=rr(st.price,st.target,st.stop);
  const rrPass=!isNaN(p)&&!isNaN(t)&&!isNaN(s)&&p>0&&(t-p)>0&&(p-s)>0&&((t-p)/(p-s))>=2;
  const stopPass=!isNaN(p)&&!isNaN(s)&&s>0&&s<p;
  const stopPct=stopPass?(((s-p)/p*100).toFixed(1)+'% from price'):'Set a stop below current price';
  const rows=[
    {cls:rrPass?'pass':'fail', ic:rrPass?'✓':'✕', name:'Risk : Reward ≥ 2 : 1',
     det:rrPass?('Currently '+r.txt):('Currently '+r.txt+' — fix target/stop or skip the trade')},
    {cls:stopPass?'pass':'fail', ic:stopPass?'✓':'✕', name:'Stop-loss defined',
     det:stopPct},
  ];
  let html=rows.map(x=>`<div class="gitem ${x.cls}"><span class="g-ic">${x.ic}</span>
    <span class="g-txt"><span class="g-name">${x.name}</span><div class="g-det">${x.det}</div></span></div>`).join('');
  html+=`<div class="gitem manual ${manual.earnings?'checked':''}" onclick="gateToggle('earnings')">
      <span class="g-ic">${manual.earnings?'✓':'?'}</span>
      <span class="g-txt"><span class="g-name">No earnings within 10 sessions</span>
      <div class="g-det">Checked the results calendar — no binary event ahead</div></span></div>
    <div class="gitem manual ${manual.weekly?'checked':''}" onclick="gateToggle('weekly')">
      <span class="g-ic">${manual.weekly?'✓':'?'}</span>
      <span class="g-txt"><span class="g-name">Weekly chart is Stage 2</span>
      <div class="g-det">Higher TF defines the stage — rising structure, not a bounce in wreckage</div></span></div>`;
  document.getElementById('gateChecks').innerHTML=html;
  document.getElementById('gateConfirm').disabled=!(rrPass&&stopPass&&manual.earnings&&manual.weekly);
}
function gateToggle(k){ if(!gateCtx)return; gateCtx.manual[k]=!gateCtx.manual[k]; renderGate(); }
function gateCancel(){
  if(gateCtx){ gateCtx.sel.value=gateCtx.st.status; } // revert the dropdown
  gateCtx=null;
  document.getElementById('gateOv').classList.remove('show');
}
function gateConfirmEntry(){
  if(!gateCtx) return;
  const {card, st, sel}=gateCtx;
  st.status='in'; if(!st.date) st.date=today();
  save(); sel.value='in';
  updateStatusClass(card,'in'); recount(); applyFilterTo(card); checkFilterEmpty();
  const di=card.querySelector('input[type="date"]'); if(di) di.value=st.date;
  gateCtx=null;
  document.getElementById('gateOv').classList.remove('show');
}

/* ---------------- v3: BACKUP REMINDER ---------------- */
const BK_LAST='codex_stock_log_lastbackup', BK_SNOOZE='codex_stock_log_bksnooze';
function checkBackupReminder(){
  if(stocks.length<3) return;
  let last=0,snooze=0;
  try{last=parseInt(localStorage.getItem(BK_LAST)||'0');}catch(e){}
  try{snooze=parseInt(localStorage.getItem(BK_SNOOZE)||'0');}catch(e){}
  if(snooze && Date.now()<snooze) return;
  if(last && (Date.now()-last)/86400000<10) return;
  const banner=document.getElementById('bkBanner');
  const msg=last?('Last backup was '+Math.floor((Date.now()-last)/86400000)+' days ago.'):'Your log lives only on this device.';
  banner.innerHTML=`<span>${msg} A cleared browser wipes it — save a backup file.</span>
    <button class="bk-now" onclick="exportData();hideBackupBanner()">Back up</button>
    <button class="bk-later" onclick="snoozeBackup()">Later</button>`;
  banner.classList.remove('hid');
}
function hideBackupBanner(){document.getElementById('bkBanner').classList.add('hid');}
function snoozeBackup(){try{localStorage.setItem(BK_SNOOZE,String(Date.now()+2*86400000));}catch(e){} hideBackupBanner();}

/* ---------------- ADD ---------------- */
function addStock(){
  const st={id:uid(),name:'',price:'',target:'',stop:'',setup:'',status:'cand',priority:'none',date:today(),note:''};
  stocks.unshift(st); save();
  const e=listEl.querySelector('.empty'); if(e) e.remove();
  const card=buildCard(st);
  listEl.prepend(card);
  recount(); applyFilterTo(card);
  card.querySelector('.tk-input').focus();
  card.scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---------------- BACKUP / RESTORE ---------------- */
function exportData(){
  const blob=new Blob([JSON.stringify(stocks,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='stock-log-backup-'+today()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importData(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const data=JSON.parse(r.result);
      if(Array.isArray(data)){
        if(!confirm('Replace current log with backup ('+data.length+' stocks)?')) return;
        stocks=data.map(x=>({id:x.id||uid(),name:x.name||'',price:x.price||'',target:x.target||'',
          stop:x.stop||'',setup:x.setup||'',status:x.status||'cand',priority:x.priority||'none',date:x.date||today(),note:x.note||''}));
        save(); renderAll();
      } else alert('That file doesn’t look like a Stock Log backup.');
    }catch(e){ alert('Could not read that file.'); }
    ev.target.value='';
  };
  r.readAsText(f);
}

/* ---------------- HELPERS ---------------- */
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ---------------- SERVICE WORKER ---------------- */
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}); }

renderAll();
syncSortBtn();
checkBackupReminder();
</script>
</body>
